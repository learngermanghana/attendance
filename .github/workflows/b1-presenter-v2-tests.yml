name: A1+A2+B1+B2+C1 Presenter 2.0 Tests

on:
  pull_request:
    paths:
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeachingSlidePresenter.css"
      - "src/utils/teachingPresenter.js"
      - "src/data/teacherSlideSupport.js"
      - "src/data/courseDictionary.js"
      - "src/data/courseSessionGroups.js"
      - "src/data/teachingSlides.js"
      - "src/data/a1WorkbookAlignedSlidesDays1To5.js"
      - "src/data/a1WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a2WorkbookAlignedSlides.js"
      - "src/data/a2WorkbookAlignedSlidesDays6To10.js"
      - "src/data/a2WorkbookAlignedSlidesDays11To15.js"
      - "src/data/a2WorkbookAlignedSlidesDays16To20.js"
      - "src/data/a2WorkbookAlignedSlidesDays21To24.js"
      - "src/data/a2WorkbookAlignedSlidesDays25To28.js"
      - "src/data/b2PresenterSlides.js"
      - "src/data/c1PresenterSlides.js"
      - "src/data/b1WorkbookAlignedSlidesDays1To10.js"
      - "src/data/b1WorkbookAlignedSlidesDays11To20.js"
      - "src/data/b1WorkbookAlignedSlidesDays21To28.js"
      - "scripts/patchB2C1SpeakingModels.mjs"
      - "tests/a1-presenter-v2-all-lessons.test.js"
      - "tests/a1-workbook-aligned-slides-days1-5.test.js"
      - "tests/a1-workbook-aligned-slides-days6-10.test.js"
      - "tests/a2-presenter-v2-all-days.test.js"
      - "tests/b1-presenter-v2-days1-6.test.js"
      - "tests/b1-presenter-v2-all-days.test.js"
      - "tests/b2-presenter-v2-all-days.test.js"
      - "tests/c1-presenter-v2-all-days.test.js"
      - "tests/b1-workbook-aligned-slides-days1-10.test.js"
      - "tests/b1-workbook-aligned-slides-days11-20.test.js"
      - "tests/b1-workbook-aligned-slides-days21-28.test.js"
      - ".github/workflows/b1-presenter-v2-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply generated teaching-slide patches
        run: node scripts/patchB2C1SpeakingModels.mjs

      - name: Test complete A1, A2, B1, B2 and C1 Presenter 2.0 rollout
        run: node --test tests/a1-presenter-v2-all-lessons.test.js tests/a1-workbook-aligned-slides-days1-5.test.js tests/a1-workbook-aligned-slides-days6-10.test.js tests/a2-presenter-v2-all-days.test.js tests/b1-presenter-v2-days1-6.test.js tests/b1-presenter-v2-all-days.test.js tests/b2-presenter-v2-all-days.test.js tests/c1-presenter-v2-all-days.test.js tests/teaching-presenter.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/b1-workbook-aligned-slides-days11-20.test.js tests/b1-workbook-aligned-slides-days21-28.test.js

      - name: Build Falowen Admin
        run: npm run build
