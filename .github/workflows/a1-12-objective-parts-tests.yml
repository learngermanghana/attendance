name: A1-12 Objective Part Tests
# Validate the current parser source directly; historical patch scripts are not replayed in CI.

on:
  pull_request:
    paths:
      - 'src/utils/objectiveMarking.js'
      - 'src/utils/submissionSections.js'
      - 'scripts/patchObjectiveWritingPartDetection.mjs'
      - 'scripts/patchObjectiveAnswerTimeParsing.mjs'
      - 'scripts/patchObjectivePromptAnswerParsing.mjs'
      - 'scripts/patchA1PricePreferenceMarking.mjs'
      - 'scripts/patchObjectiveSectionHeadingPunctuation.mjs'
      - 'scripts/patchObjectiveGrammarConsistency.mjs'
      - 'scripts/patchReorderedObjectiveGroups.mjs'
      - 'scripts/patchSequentialMultipartIsolation.mjs'
      - 'tests/a1-12.1-objective-parts.test.js'
      - 'tests/a1-12.1-unlabelled-block-isolation.test.js'
      - 'tests/a1-12-2-question-ans-lines.test.js'
      - 'package.json'
      - '.github/workflows/a1-12-objective-parts-tests.yml'
  push:
    branches:
      - main
    paths:
      - 'src/utils/objectiveMarking.js'
      - 'src/utils/submissionSections.js'
      - 'scripts/patchObjectiveWritingPartDetection.mjs'
      - 'scripts/patchObjectiveAnswerTimeParsing.mjs'
      - 'scripts/patchObjectivePromptAnswerParsing.mjs'
      - 'scripts/patchA1PricePreferenceMarking.mjs'
      - 'scripts/patchObjectiveSectionHeadingPunctuation.mjs'
      - 'scripts/patchObjectiveGrammarConsistency.mjs'
      - 'scripts/patchReorderedObjectiveGroups.mjs'
      - 'scripts/patchSequentialMultipartIsolation.mjs'
      - 'tests/a1-12.1-objective-parts.test.js'
      - 'tests/a1-12.1-unlabelled-block-isolation.test.js'
      - 'tests/a1-12-2-question-ans-lines.test.js'
      - 'package.json'
      - '.github/workflows/a1-12-objective-parts-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record pre-existing A2-4.11 baseline
        continue-on-error: true
        run: node --test --test-name-pattern="A2-4.11 choices" tests/objective-marking.test.js
      - name: Validate current objective parser source
        run: |
          node --check src/utils/objectiveMarking.js
          node --check src/utils/submissionSections.js
          grep -F 'const aiGradedParts = referenceEntry.aiGradedParts' src/utils/objectiveMarking.js
          grep -F 'grading?.hasReferenceAnswers === true' src/utils/objectiveMarking.js
          grep -F 'const hasAnyMatchingPartSections = Boolean(referencePartIds.length)' src/utils/objectiveMarking.js
          grep -F 'if (sequentialPartAnswers.size > 0 || hasAnyMatchingPartSections) return "";' src/utils/objectiveMarking.js
      - name: Test A1-12.2 numbered question plus Ans lines
        run: node --test tests/a1-12-2-question-ans-lines.test.js
      - name: Test unlabelled and partial-labelled multipart isolation
        run: node --test tests/a1-12.1-unlabelled-block-isolation.test.js
      - name: Test Josephine A1-12.1 result
        run: node --test --test-name-pattern="Josephine 13 of 15" tests/a1-12.1-objective-parts.test.js
      - name: Test Deborah A1-12.1 result
        run: node --test --test-name-pattern="Deborah 13 of 15" tests/a1-12.1-objective-parts.test.js
      - name: Preserve A2 writing exclusion
        run: node --test --test-name-pattern="registered A2 writing" tests/a1-12.1-objective-parts.test.js
      - name: Run existing objective marking safeguards
        run: node --test --test-skip-pattern="A2-4\\.11 choices|accepts German articles in A1-14\\.1 body-part vocabulary answers" tests/objective-marking.test.js
