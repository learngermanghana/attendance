name: Teaching slides tests

on:
  pull_request:
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/StudentCourseSlides.jsx"
      - "src/components/StudentCourseSlides.css"
      - "src/data/**"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "src/utils/studentSlidePractice.js"
      - "src/utils/autoMarking.js"
      - "scripts/patchB2C1SpeakingModels.mjs"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "scripts/data/b2c1-speaking-models-*.txt"
      - "tests/**"
      - "package.json"
      - ".github/workflows/teaching-presenter-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/components/SessionDictionaryPicker.jsx"
      - "src/components/TeachingSlidePresenter.jsx"
      - "src/components/TeacherLessonBlocks.jsx"
      - "src/components/TeacherLessonBlocks.css"
      - "src/components/StudentCourseSlides.jsx"
      - "src/components/StudentCourseSlides.css"
      - "src/data/**"
      - "src/pages/TeachingSlidesPage.jsx"
      - "src/pages/TeachingSlidesPage.css"
      - "src/utils/teachingPresenter.js"
      - "src/utils/studentSlidePractice.js"
      - "src/utils/autoMarking.js"
      - "scripts/patchB2C1SpeakingModels.mjs"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "scripts/data/b2c1-speaking-models-*.txt"
      - "tests/**"
      - "package.json"
      - ".github/workflows/teaching-presenter-tests.yml"

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply B2/C1 speaking-model patch
        run: node scripts/patchB2C1SpeakingModels.mjs
      - name: Apply objective parser patch
        run: node scripts/patchNumberedTextObjectiveSections.mjs
      - name: Test A1 objective parser
        run: node --test tests/a1-02-unnumbered-trailing-objective-text.test.js
      - name: Run teaching slide regression tests
        run: node --test tests/teaching-presenter.test.js tests/teacher-slide-support.test.js tests/a1-workbook-aligned-slides-days1-5.test.js tests/a1-workbook-aligned-slides-days6-10.test.js tests/a2-workbook-aligned-slides.test.js tests/a2-workbook-aligned-slides-days6-10.test.js tests/a2-workbook-aligned-slides-days11-15.test.js tests/a2-workbook-aligned-slides-days16-20.test.js tests/a2-workbook-aligned-slides-days21-24.test.js tests/a2-workbook-aligned-slides-days25-28.test.js tests/b1-workbook-aligned-slides-days1-10.test.js tests/b1-workbook-aligned-slides-days11-20.test.js tests/b1-workbook-aligned-slides-days21-28.test.js tests/teacher-lesson-guidance.test.js tests/*speaking-model-answers.test.js
      - name: Build production bundle
        run: npm run build
