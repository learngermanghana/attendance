name: A1 objective parser tests

on:
  pull_request:
    paths:
      - "src/utils/autoMarking.js"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "tests/a1-02-unnumbered-trailing-objective-text.test.js"
      - ".github/workflows/a1-objective-parser-tests.yml"
  push:
    branches:
      - main
    paths:
      - "src/utils/autoMarking.js"
      - "scripts/patchNumberedTextObjectiveSections.mjs"
      - "tests/a1-02-unnumbered-trailing-objective-text.test.js"
      - ".github/workflows/a1-objective-parser-tests.yml"

permissions:
  contents: read

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply objective parser patch
        run: node scripts/patchNumberedTextObjectiveSections.mjs

      - name: Test A1-0.2 unnumbered trailing answers
        run: node --test tests/a1-02-unnumbered-trailing-objective-text.test.js

      - name: Build admin
        run: npm run build
